{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Crear Nueva Ruta</h1>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'trekly_admin_dashboard' %}">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="{% url 'trekly_admin_routes' %}">Rutas</a></li>
            <li class="breadcrumb-item active">Nueva Ruta</li>
        </ol>
    </nav>
    
    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="name" class="form-label">Nombre de la ruta *</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                
                <div class="mb-3">
                    <label for="description" class="form-label">Descripción *</label>
                    <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="difficulty" class="form-label">Dificultad *</label>
                        <select class="form-control" id="difficulty" name="difficulty" required>
                            <option value="">Seleccionar...</option>
                            <option value="easy">Fácil</option>
                            <option value="moderate">Moderada</option>
                            <option value="hard">Difícil</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="duration" class="form-label">Duración (días) *</label>
                        <input type="number" class="form-control" id="duration" name="duration" min="1" required>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label">Precio *</label>
                        <input type="number" class="form-control" id="price" name="price" min="0" step="0.01" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="max_participants" class="form-label">Máximo de participantes *</label>
                        <input type="number" class="form-control" id="max_participants" name="max_participants" min="1" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="location" class="form-label">Ubicación</label>
                    <input type="text" class="form-control" id="location" name="location" placeholder="Ej: Cusco, Perú">
                </div>
                
                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="is_active" name="is_active" checked>
                        <label class="form-check-label" for="is_active">
                            Activar ruta inmediatamente
                        </label>
                    </div>
                </div>
                
                <div class="mt-4">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-save"></i> Crear Ruta
                    </button>
                    <a href="{% url 'trekly_admin_routes' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
