{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Editar Usuario</h1>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'trekly_admin_dashboard' %}">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="{% url 'trekly_admin_users' %}">Usuarios</a></li>
            <li class="breadcrumb-item"><a href="{% url 'trekly_admin_user_detail' user_detail.id %}">{{ user_detail.username }}</a></li>
            <li class="breadcrumb-item active">Editar</li>
        </ol>
    </nav>
    
    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="username" class="form-label">Nombre de usuario</label>
                    <input type="text" class="form-control" id="username" value="{{ user_detail.username }}" disabled>
                    <small class="text-muted">El nombre de usuario no se puede cambiar</small>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="first_name" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user_detail.first_name }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="last_name" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user_detail.last_name }}">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ user_detail.email }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Permisos</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="is_guide" name="is_guide" {% if user_detail.is_guide %}checked{% endif %}>
                        <label class="form-check-label" for="is_guide">
                            Es guía
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="is_staff" name="is_staff" {% if user_detail.is_staff %}checked{% endif %}>
                        <label class="form-check-label" for="is_staff">
                            Es staff
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="is_superuser" name="is_superuser" {% if user_detail.is_superuser %}checked{% endif %}>
                        <label class="form-check-label" for="is_superuser">
                            <strong class="text-danger">Es Super Admin</strong> (acceso total al sistema)
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if user_detail.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">
                            Cuenta activa
                        </label>
                    </div>
                </div>
                
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar cambios
                    </button>
                    <a href="{% url 'trekly_admin_user_detail' user_detail.id %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
