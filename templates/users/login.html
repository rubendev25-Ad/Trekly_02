{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Trekly{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">Iniciar Sesión</h2>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100 mb-3">
                            <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                        </button>

                        <div class="text-center mb-3">
                            <span class="text-muted">O continúa con</span>
                        </div>

                        <a href="{% url 'google_login' %}" class="btn btn-outline-danger w-100 mb-3">
                            <i class="bi bi-google"></i> Continuar con Google
                        </a>

                        <p class="text-center mb-0">
                            ¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate aquí</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
