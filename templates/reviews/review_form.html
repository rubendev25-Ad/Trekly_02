{% extends 'base.html' %}

{% block title %}Escribir Reseña - Trekly{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="mb-4"><i class="bi bi-star"></i> {% if review %}Editar{% else %}Escribir{% endif %} Reseña</h2>

                    <div class="alert alert-info">
                        <h5>{{ route.title }}</h5>
                        <p class="mb-0"><i class="bi bi-geo-alt"></i> {{ route.location }}</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label class="form-label">Calificación *</label>
                            <div class="rating-stars">
                                {% for i in "12345" %}
                                <input type="radio" name="rating" id="star{{ i }}" value="{{ i }}" 
                                       {% if review and review.rating == i|add:0 %}checked{% endif %} required>
                                <label for="star{{ i }}">
                                    <i class="bi bi-star-fill"></i>
                                </label>
                                {% endfor %}
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="comment" class="form-label">Comentario *</label>
                            <textarea class="form-control" id="comment" name="comment" rows="5" 
                                      required placeholder="Comparte tu experiencia...">{% if review %}{{ review.comment }}{% endif %}</textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-send"></i> {% if review %}Actualizar{% else %}Publicar{% endif %} Reseña
                            </button>
                            <a href="{% url 'route_detail' route.id %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.rating-stars {
    display: flex;
    flex-direction: row-reverse;
    justify-content: flex-end;
    gap: 5px;
}
.rating-stars input[type="radio"] {
    display: none;
}
.rating-stars label {
    cursor: pointer;
    font-size: 2rem;
    color: #ddd;
    transition: color 0.2s;
}
.rating-stars input[type="radio"]:checked ~ label,
.rating-stars label:hover,
.rating-stars label:hover ~ label {
    color: #ffc107;
}
</style>
{% endblock %}
